name: Deploy dashboards

# This workflow deploys the HTML shell only. Live figures are fetched by the
# page itself from the Pages Function in functions/<dashboard>/data.json.js,
# which queries Odoo at request time — so nothing here needs Odoo credentials,
# and nothing here runs on a schedule. It fires only when the source of the
# shell changes, which keeps it off GitHub's billed Actions minutes.
#
# Because it renders with --shell, this job has NO access to Odoo. That is
# deliberate: the only place Odoo credentials now exist is as Cloudflare Pages
# secrets, reachable solely by the Function behind Cloudflare Access.
on:
  push:
    branches: [main]
    paths:
      - "templates/**"
      - "config/**"
      - "dashboards/**"
      - "scripts/**"
      - "functions/**"
      - "lib/**"
      - ".github/workflows/refresh.yml"
  workflow_dispatch: {}   # trigger a redeploy manually from the Actions tab

concurrency:
  group: refresh-dashboards
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write   # cloudflare/pages-action needs this to record the deployment
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Render dashboard shells (no Odoo access)
        run: python scripts/generate.py --all --shell

      - name: Include Pages Functions (the live-data endpoints)
        run: cp -r functions output/

      # The Functions import from lib/, which sits outside output/. Wrangler
      # bundles those imports at deploy time, so lib/ must be present in the
      # checkout (it is) — no copy needed, but a missing lib/ would fail the
      # deploy here rather than silently shipping a broken endpoint.
      - name: Sanity-check the shared data layer is present
        run: test -f lib/index.js && test -f lib/jsonrpc.js

      - name: Unit-test the data layer
        run: npm test

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: bison-dashboards   # must already exist — see README
          directory: output
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
