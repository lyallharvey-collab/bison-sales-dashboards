name: Deploy dashboards

# Live data no longer comes from this workflow — the bison-dashboard-refresher
# Cloudflare Worker pulls Odoo on its own 2-minute Cron Trigger and writes to
# KV; Pages Functions serve that live data on every page load. This workflow
# only (re)deploys the static HTML/CSS/JS shell (and a baked-in fallback
# payload for first paint) when the template/config/Worker source changes —
# occasional, not continuous, which is what keeps this off GitHub's billed
# Actions minutes at any real volume.
on:
  push:
    branches: [main]
    paths:
      - "templates/**"
      - "config/**"
      - "dashboards/**"
      - "scripts/**"
      - "functions/**"
      - ".github/workflows/refresh.yml"
  workflow_dispatch: {}   # trigger a redeploy manually from the Actions tab

concurrency:
  group: refresh-dashboards
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write   # cloudflare/pages-action needs this to record the deployment
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Generate dashboards
        env:
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_USERNAME: ${{ secrets.ODOO_USERNAME }}
          ODOO_PASSWORD: ${{ secrets.ODOO_PASSWORD }}
        run: python scripts/generate.py --all

      - name: Include Pages Functions (live-data endpoints)
        run: cp -r functions output/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: bison-dashboards   # must already exist — see README
          directory: output
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
