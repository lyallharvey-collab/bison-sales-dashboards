name: Refresh dashboards

on:
  schedule:
    - cron: "*/10 * * * *"   # best-effort — GitHub can delay scheduled runs, see README
  workflow_dispatch: {}       # lets you trigger a refresh manually from the Actions tab

concurrency:
  group: refresh-dashboards
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Generate dashboards
        env:
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_USERNAME: ${{ secrets.ODOO_USERNAME }}
          ODOO_PASSWORD: ${{ secrets.ODOO_PASSWORD }}
        run: python scripts/generate.py --all

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: bison-dashboards   # must already exist — see README
          directory: output
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
